<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Colaborate</title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <span class="brand">⚡ Colaborate</span>
            <h1>Create account</h1>
            <p class="subtitle">Start managing your projects today.</p>

            <div class="field">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Your name" />
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 6 chars, 1 uppercase, 1 number" />
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" id="password-cfn" placeholder="Repeat password" />
            </div>

            <button class="btn btn-primary" id="sbt-button" type="button">Create Account</button>
            <div id="error" class="error-msg"></div>

            <div class="auth-footer">
                Already have an account? <a href="../login/login.html">Log in</a>
            </div>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
